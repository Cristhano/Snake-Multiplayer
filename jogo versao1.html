<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo sem obsevers</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;

            align-items: center;
            justify-content: center;
        }

        #screen {
            border: solid 10px gray;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;

            width: 500px;
            height: 500px;
        }
    </style>
</head>

<body>
    <canvas id="screen" width="21" height="21"></canvas>

    <script type="module">
        const screen = document.getElementById("screen");
        const context = screen.getContext('2d')

        let count = 1
        let currentPlayer = 'player' + count

        function CreateGame() {
            const state = {
                players: {},
                fruits: {}
            }

            //Adicionar----------
            function addPlayer(command) {
                const player = command.playerId
                const X = command.playerX
                const Y = command.playerY

                state.players[player] = {
                    x: X,
                    y: Y,
                    cont: 0
                }
            }
            function addFruit(command) {
                const fruit = command.fruitId
                let X = command.fruitX
                let Y = command.fruitY
                const random = command.random

                if (!random) {
                    state.fruits[fruit] = { x: X, y: Y }
                } if (random) {
                    X = Math.floor(Math.random() * screen.width)
                    Y = Math.floor(Math.random() * screen.height)

                    state.fruits[fruit] = { x: X, y: Y }
                }
            }

            //remover---------
            function removeplayer(player) {
                delete state.players[player]
                console.log(state.players)
            }
            function removeFruit(fruit) {
                delete state.fruits[fruit]
                console.log(state.players)
            }
            //Checa Coilsão
            function checkColision(plyr) {
                const player = state.players[plyr]
                let playerX = player.x
                let playerY = player.y

                for (const fruitId in state.fruits) {
                    const fruit = state.fruits[fruitId]
                    let fruitX = fruit.x
                    let fruitY = fruit.y

                    if (playerX === fruitX & playerY === fruitY) {
                        removeFruit(fruitId)
                        player.cont += 1
                        addFruit({ fruitId: 'fruit' + Math.floor(Math.random() * 10), random: true })
                        console.log(player.cont)
                    }
                }
            }
            //Mover Jogador------
            function movePlayer(command) {
                const player = state.players[command.playerId];

                const KeyPressed = {
                    ArrowUp: function () {
                        if (player.y > 0) {
                            player.y -= 1;
                        };
                    },
                    ArrowDown: function () {
                        if (player.y < screen.height - 1) {
                            player.y += 1;
                        };
                    },
                    ArrowLeft: function () {
                        if (player.x > 0) {
                            player.x -= 1;
                        };
                    },
                    ArrowRight: function () {
                        if (player.x < screen.width - 1) {
                            player.x += 1;
                        };
                    }
                }


                let KeyFunction = KeyPressed[command.keypressed]
                if (KeyFunction) { KeyFunction() }

                checkColision(currentPlayer)
            }

            return {
                movePlayer,
                addPlayer,
                addFruit,
                removeplayer,
                state
            };
        };
        
        function createKeybordListenes() {
            const state = {
                obsevers:[] //observadores
            }

            function subscribe(ObseverFunction){ // Registrar Observador
                state.obsevers.push(ObseverFunction)
            }
            function NotifyAll(command){
                console.log('Notificando ' + state.obsevers.length + ' Observadores.')

                for(const ObseverFunction of state.obsevers){
                    ObseverFunction(command)
                }
            }
            
            document.addEventListener("keydown", handleKeyDown) //input

            function handleKeyDown(event) {
                const keypressed = event.key

                const command = {
                    playerId: currentPlayer,
                    keypressed
                }
                NotifyAll(command)
            }
            return{
                subscribe
            }
        }


        const game = CreateGame()
        const KeybordListenes = createKeybordListenes()

        KeybordListenes.subscribe(game.movePlayer)
        game.addPlayer({ playerId: currentPlayer, playerX: 10, playerY: 10 })
        game.addFruit({ fruitId: "Fruit1", fruitX: 6, fruitY: 3, random: true })

        //-----------------------------------------------------------------------------------------
        function renderScreen() { // função para renderizar imagem
            context.fillStyle = 'white'
            context.globalAlpha = 1;
            context.clearRect(0, 0, screen.width, screen.height) //limpar o canvas

            for (const playerId in game.state.players) { //renderiza os players
                const player = game.state.players[playerId]
                context.fillStyle = 'black' //cor do jogadores
                context.globalAlpha = 0.5;
                if (playerId === currentPlayer) { context.fillStyle = "red"; context.globalAlpha = 0.9; }
                context.fillRect(player.x, player.y, 1, 1)
            }
            for (const fruitId in game.state.fruits) { //renderiza as frutas
                const fruit = game.state.fruits[fruitId]
                context.fillStyle = "green"
                context.globalAlpha = 1;
                context.fillRect(fruit.x, fruit.y, 1, 1)
            }
            requestAnimationFrame(renderScreen)// chama a função para renderizar a imagem
        }

        renderScreen(); // chama a função para renderizar a imagem
    </script>
</body>

</html>
