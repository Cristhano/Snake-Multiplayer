<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;

            align-items: center;
            justify-content: center;
        }

        #screen {
            border: solid 10px gray;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;

            width: 500px;
            height: 500px;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <canvas id="screen" width="21" height="21"></canvas>

    <script type="module">
        import createKeybordListenes from './KeybordListenes.js'
        import CreateGame from './game.js'
        import renderScreen from './render-screen.js'

        const socket = io()
        const screen = document.getElementById("screen");
        let game = CreateGame()
        let playerId = ''

        socket.on('connect', () => {
            playerId = socket.id
            console.log('Jogador conectado no servidor com o id:' + playerId)
            console.log(playerId)  

            renderScreen(screen, game, playerId, requestAnimationFrame); // chama a função para renderizar a imagem
        })

        socket.on('disconnect', (socket) => {
            console.log(game.state)
            console.log('Desconectando jogador: ')
            console.log(socket.id)
            game.removeplayer(socket.id)
        })
        socket.on('setup', (state) => {
            game.state = state
            
            const KeybordListenes = createKeybordListenes(document, playerId)
            KeybordListenes.registerPlayerId(playerId)
            KeybordListenes.subscribe(game.movePlayer)
        })
        socket.on('add-player', (command) => {
            console.log('Adicionado novo jogador: ' + command.playerId)
            console.log('com X: ' + command.playerX + " Y: " + command.playerY)
            game.addPlayer(command)
        })
        socket.on('remove-player', (command) => {
            console.log('Jogador removido ' + command.playerId)
            game.removeplayer(command)
        })
        
    </script>
</body>

</html>
